# Auto-deploys the web app to your Hugging Face Space whenever you push.
# Requires a repository secret HF_TOKEN (a Hugging Face token with "write" access).
# Optional repository secret APP_PASSWORD: the password you'll type to open the app.
# Optional repository variable HF_SPACE (defaults to "reelbot").
name: Deploy web app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["reelbot/**", "assets/**", "Dockerfile", "requirements*.txt", "config.yaml", "scripts/deploy_hf.py",
            ".github/workflows/deploy-hf.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::No HF_TOKEN secret set; skipping deploy. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          pip install -q huggingface_hub
          ARGS=(--space "${{ vars.HF_SPACE || 'reelbot' }}")
          if [ -n "$APP_PASSWORD" ]; then ARGS+=(--password "$APP_PASSWORD"); fi
          python scripts/deploy_hf.py "${ARGS[@]}" | tee deploy.txt
          {
            echo "## ReelBot deployed"
            echo ""
            sed 's/^/- /' deploy.txt
            echo ""
            echo "Open the **App** link in Safari on your iPhone → Share → **Add to Home Screen**."
          } >> "$GITHUB_STEP_SUMMARY"
