# Free daily automation on GitHub Actions: makes one reel and posts it to YouTube.
# Setup: run `python -m reelbot auth` locally once, then add the contents of
# credentials/token.json as a repository secret named YT_TOKEN_JSON.
# Without that secret, the workflow still renders the reel and attaches it as a build artifact.
name: Daily reel

on:
  schedule:
    - cron: "17 14 * * *"   # every day at 14:17 UTC — change to suit your audience
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | evergreen | news | market"
        default: auto

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Restore voice model and history
        uses: actions/cache@v4
        with:
          path: |
            .cache/voices
            output/history.json
          key: reelbot-${{ github.run_id }}
          restore-keys: reelbot-

      - name: Write YouTube token
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN_JSON" ]; then
            mkdir -p credentials && printf '%s' "$YT_TOKEN_JSON" > credentials/token.json
            echo "UPLOAD=--upload" >> "$GITHUB_ENV"
          else
            echo "No YT_TOKEN_JSON secret; the reel will be rendered but not uploaded."
          fi

      - name: Make reel
        run: python -m reelbot make --mode "${{ github.event.inputs.mode || 'auto' }}" $UPLOAD

      - name: Keep the video as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            output/*/reel.mp4
            output/*/metadata.json
            output/*/script.txt
          retention-days: 7
