<!doctype html>
<html><head><meta charset="utf-8"><title>ReelBot launch</title>
<style>
@font-face { font-family: "Anton"; src: url("assets/Anton-Regular.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; transition: none !important; animation: none !important; }
html, body { background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #05060a; color: #eceef4; font-family: "Inter", sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
.abs { position: absolute; }
.layer { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: none; }
.persp { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 45%; transform-style: preserve-3d; }
.h1 { font-family: "Inter Display", "Inter"; font-weight: 900; letter-spacing: -0.04em; word-spacing: 0.04em; line-height: 0.98; }
.h2 { font-family: "Inter Display", "Inter"; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; }
.sub { font-family: "Inter"; font-weight: 500; color: #a4abbf; letter-spacing: -0.012em; line-height: 1.38; }
.mono { font-family: "JetBrains Mono"; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.y { color: #facc15; }
.g { color: #34d399; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.08em 0.02em 0.16em; margin: -0.08em 0 -0.16em; }
.wi { display: inline-block; }
/* phone */
.phone { position: absolute; transform-style: preserve-3d; }
.phone-shadow { position: absolute; left: 8%; right: 8%; bottom: -6%; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.75), rgba(0,0,0,0)); }
.phone-glow { position: absolute; inset: -18% -40%; background: radial-gradient(closest-side, rgba(250,204,21,.20), rgba(250,204,21,0)); }
.phone-body { position: absolute; inset: 0; border-radius: 13% / 6%; padding: 0;
  background: linear-gradient(150deg, #3b4152 0%, #151821 18%, #0b0d13 50%, #1b1f2a 82%, #4a5165 100%);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 0 0 4px #07080c, 0 50px 90px -30px rgba(0,0,0,.9); }
.phone-screen { position: absolute; left: 3.2%; right: 3.2%; top: 1.48%; bottom: 1.48%; border-radius: 10.4% / 4.8%; overflow: hidden; background: #07080d; }
.phone-screen > .scr { position: absolute; left: 0; top: 0; width: 100%; }
.phone-screen img { display: block; width: 100%; }
.phone-island { position: absolute; top: 2.5%; left: 50%; width: 29%; height: 3.3%; transform: translateX(-50%); background: #000; border-radius: 99px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.phone-glare { position: absolute; inset: 0; border-radius: 13% / 6%; background: linear-gradient(120deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 72%, rgba(255,255,255,.05) 100%); pointer-events: none; }
.sweep { position: absolute; inset: -20%; background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.22) 50%, rgba(255,255,255,0) 60%); }
/* browser window */
.browser { position: absolute; border-radius: 14px; overflow: hidden; background: #0f1119; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 60px 120px -40px rgba(0,0,0,.95), 0 0 120px -20px rgba(250,204,21,.18); }
.browser-bar { position: relative; display: flex; align-items: center; gap: 0; background: #12141d; border-bottom: 1px solid rgba(255,255,255,.07); }
.browser-bar i { display: block; border-radius: 50%; }
.browser-url { position: absolute; left: 50%; transform: translateX(-50%); background: #0a0b11; border: 1px solid rgba(255,255,255,.08); color: #8b93a8; font-family: "Inter"; font-weight: 500; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
.browser img { display: block; width: 100%; }
/* tiles */
.tile { position: absolute; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 40px 80px -30px rgba(0,0,0,.9); }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.label { font-family: "JetBrains Mono"; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #a4abbf; text-align: center; white-space: nowrap; }
/* badges */
.badge { position: absolute; display: flex; align-items: center; gap: 0.7em; padding: 0.7em 1.05em 0.7em 0.75em; border-radius: 0.9em; white-space: nowrap;
  background: rgba(17,19,28,.94); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 48px -16px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4);
  font-family: "Inter"; font-weight: 650; color: #eceef4; letter-spacing: -0.01em; }
.badge .ic { width: 1.9em; height: 1.9em; border-radius: 0.6em; display: grid; place-items: center; flex: none; }
.badge .ic svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pill { position: absolute; display: inline-flex; align-items: center; gap: .55em; padding: .55em 1.05em; border-radius: 99px; white-space: nowrap;
  background: rgba(21,24,36,.92); border: 1px solid rgba(255,255,255,.13); font-family: "Inter"; font-weight: 600; color: #eceef4; }
.pill .dot { width: .55em; height: .55em; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 .25em rgba(52,211,153,.18); }
.tap { position: absolute; border-radius: 50%; }
.blob { position: absolute; border-radius: 50%; }
.grid-floor { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 70%; transform-origin: 50% 100%;
  background-image: linear-gradient(rgba(250,204,21,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(250,204,21,.22) 2px, transparent 2px);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,.6) 40%, rgba(0,0,0,0) 85%); }
.rays { position: absolute; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(250,204,21,0) 0deg, rgba(250,204,21,.22) 3deg, rgba(250,204,21,0) 9deg, rgba(250,204,21,0) 15deg);
  -webkit-mask-image: radial-gradient(closest-side, rgba(0,0,0,1) 8%, rgba(0,0,0,.5) 40%, rgba(0,0,0,0) 72%); }
.particle { position: absolute; border-radius: 50%; }
.bar { position: absolute; bottom: 0; border-radius: 99px; background: linear-gradient(#fde047, #facc15); }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .07; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
</style></head>
<body><div id="stage"></div>
<script src="timeline.js"></script>
<script src="ui/boxes.js"></script>
<script src="promo.js"></script>
</body></html>
